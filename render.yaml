## Pick & Pill — Render.com 배포 설정
## https://render.com/docs/blueprint-spec

services:
  # ── 1. 프론트엔드 (React SPA) ──────────────────────────────
  - type: web
    name: picknpill-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_KAKAO_JS_KEY
        sync: false
      - key: VITE_KAKAO_REST_API_KEY
        sync: false
      - key: VITE_IMP_CODE
        sync: false
      - key: VITE_APP_URL
        sync: false
      - key: VITE_API_URL
        sync: false          # 백엔드 URL (예: https://picknpill-api.onrender.com)

  # ── 2. 백엔드 API (Node.js) ────────────────────────────────
  - type: web
    name: picknpill-api
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node index.js
    plan: starter              # Cold Start 방지 ($7/월)
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        sync: false            # 프론트엔드 URL
      - key: SESSION_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false            # 절대 프론트엔드에 노출 금지
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_REDIRECT_URI
        sync: false
      - key: IMP_KEY
        sync: false
      - key: IMP_SECRET
        sync: false
      - key: SOLAPI_API_KEY
        sync: false
      - key: SOLAPI_API_SECRET
        sync: false
      - key: SOLAPI_SENDER
        sync: false
      - key: KAKAO_CHANNEL_ID
        sync: false
      - key: SOLAPI_TEMPLATE_ORDER
        sync: false
      - key: SOLAPI_TEMPLATE_SAMPLE
        sync: false
      - key: SOLAPI_TEMPLATE_REVIEW
        sync: false
      - key: SOLAPI_TEMPLATE_REPURCHASE
        sync: false
      - key: SOLAPI_TEMPLATE_CHECKIN
        sync: false

  # ── 3. CRM 배치 스케줄러 ────────────────────────────────────
