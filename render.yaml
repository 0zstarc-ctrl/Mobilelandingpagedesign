## Pick & Pill — Render.com 배포 설정
## https://render.com/docs/blueprint-spec

services:
  # ── 1. 프론트엔드 (React SPA) ──────────────────────────────
  - type: web
    name: picknpill-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    headers:
      # SPA 라우팅을 위해 모든 경로를 index.html 로 fallback
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false          # Render 대시보드에서 직접 입력
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: VITE_KAKAO_JS_KEY
        sync: false
      - key: VITE_IMP_CODE
        sync: false
      - key: VITE_APP_URL
        sync: false

